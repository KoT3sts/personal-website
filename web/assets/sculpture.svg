<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" fill="none">
 <style>
  /* The two orbit points travel the tilted ring together, a fixed arc apart,
     passing behind the sphere. They rest where drawn under reduced motion or
     when the image is requested as sculpture.svg#still (motion.js does that
     because Chrome does not pass the page's reduced-motion setting into
     SVG images). */
  .orbiter { transform-box: fill-box; offset-anchor: center; offset-rotate: 0deg; offset-path: path("M621.9 150.2A290 93 -34 1 1 138.1 469.8A290 93 -34 1 1 621.9 150.2Z"); offset-distance: 0%; animation: orbit 96s linear infinite; }
  .orbiter-trail { offset-path: path("M139.9 425A290 93 -34 1 1 620.1 195A290 93 -34 1 1 139.9 425Z"); }
  @keyframes orbit { to { offset-distance: 100%; } }
  #still:target ~ .orbiter { animation: none; }
  @media (prefers-reduced-motion: reduce) { .orbiter { animation: none; } }
 </style>
 <defs>
  <radialGradient id="core" cx=".33" cy=".2" r=".85"><stop stop-color="#555954"/><stop offset=".35" stop-color="#222420"/><stop offset=".75" stop-color="#0c0d0c"/><stop offset="1" stop-color="#343630"/></radialGradient>
  <linearGradient id="metal" x1="140" y1="100" x2="600" y2="570" gradientUnits="userSpaceOnUse"><stop stop-color="#6f736a"/><stop offset=".22" stop-color="#fafbf2"/><stop offset=".42" stop-color="#62675b"/><stop offset=".57" stop-color="#12150e"/><stop offset=".76" stop-color="#b7bcae"/><stop offset="1" stop-color="#30352a"/></linearGradient>
  <linearGradient id="letter" x1="310" y1="250" x2="450" y2="415" gradientUnits="userSpaceOnUse"><stop stop-color="#f8f8ee"/><stop offset=".6" stop-color="#c9cec0"/><stop offset="1" stop-color="#656c5d"/></linearGradient>
  <clipPath id="ball"><circle cx="380" cy="310" r="180"/></clipPath>
 </defs>
 <!-- The ground shadow is drawn by motion.css (.hero-art::before) so it can
      answer the pointer separately from the sculpture. -->
 <g stroke="url(#metal)">
  <ellipse cx="380" cy="310" rx="290" ry="93" transform="rotate(-34 380 310)" stroke-width="13"/>
  <ellipse cx="380" cy="310" rx="266" ry="99" transform="rotate(53 380 310)" stroke-width="9"/>
 </g>
 <g id="still"/>
 <circle class="orbiter" cx="621.9" cy="150.2" r="24" fill="url(#metal)"/>
 <circle class="orbiter orbiter-trail" cx="139.9" cy="425" r="9" fill="#20241b"/>
 <circle cx="380" cy="310" r="180" fill="url(#core)"/>
 <g clip-path="url(#ball)" stroke="#a7b09d" stroke-opacity=".18" stroke-width=".8">
  <ellipse cx="380" cy="310" rx="50" ry="180"/><ellipse cx="380" cy="310" rx="105" ry="180"/><ellipse cx="380" cy="310" rx="153" ry="180"/>
  <ellipse cx="380" cy="310" rx="180" ry="46"/><ellipse cx="380" cy="310" rx="180" ry="99"/><ellipse cx="380" cy="310" rx="180" ry="149"/>
  <path d="M200 310h360M380 130v360"/>
 </g>
 <path d="M438 248a87 87 0 1 0 0 124" stroke="#030403" stroke-width="35" transform="translate(3 7)"/>
 <path d="M438 248a87 87 0 1 0 0 124" stroke="url(#letter)" stroke-width="31"/>
 <circle cx="458" cy="311" r="12" fill="#c7d2a8"/>
 <path d="M140 460C206 493 393 405 546 283" stroke="url(#metal)" stroke-width="13" stroke-linecap="round"/>
 <path d="M500 496c41-47 17-149-48-247" stroke="url(#metal)" stroke-width="9" stroke-linecap="round"/>
 <path d="M166 128v17m-8-8h17M614 442v17m-8-8h17" stroke="#858c7c" stroke-width="1.2"/>
</svg>
